[package]
name = "theprivator"
version = "2.1.0"
description = "ThePrivator Tauri 2 desktop rewrite spine"
authors = ["yanx9"]
license = "MIT"
edition = "2021"
rust-version = "1.77"
default-run = "theprivator"

[lib]
name = "theprivator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "theprivator"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tokio = { version = "1", features = ["rt", "time"] }
