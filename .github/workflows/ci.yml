name: CI

# The previous workflow triggered only on main/develop -- neither of which is
# this repository's default branch (master) or its active branch (3.0) -- and
# ran `pytest tests/`, a path that does not exist. As a result nothing was
# checked on any branch. Two consecutive commits shipped a UI that failed 87 of
# its 88 tests.
on:
  push:
    branches: [master, "3.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: TypeScript + Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npm run verify:release

      - name: Release publication regression tests
        run: node --test tests/release/publish.node.cjs

      - name: Workflow validation
        run: bash scripts/release/check-workflows.sh

      # Verification-script tests exercise the source Python sidecar too.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - run: python -m pip install -r requirements.txt

      - name: Release planning and packaging tests
        run: python -m unittest discover -s tests/release -p 'test_*.py'

      # Type errors alone do not fail the render tree, so both gates matter:
      # tsc caught nothing when the redesign broke, vitest caught everything.
      - name: Type check
        run: npx tsc --noEmit

      - name: Unit and component tests
        run: npx vitest run --testTimeout=15000

  sidecar:
    name: Python sidecar
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # tests/ holds the whole sidecar suite, including the byte-level redaction
      # contract in test_sidecar_contract.py. There is nothing to exclude any
      # more: the customtkinter GUI package those exclusions covered is gone.
      - name: Sidecar tests
        run: python -m pytest tests/ -q --timeout=120

  tauri:
    name: Rust bridge
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: src-tauri

      # Tauri's Linux build needs the WebKitGTK stack even to compile the crate.
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build the sidecar required by the Rust tests
        run: |
          npm ci
          python -m pip install -r requirements.txt -r requirements-dev.txt
          npm run sidecar:build

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test --locked
