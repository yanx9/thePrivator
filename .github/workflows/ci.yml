name: CI

# The previous workflow triggered only on main/develop -- neither of which is
# this repository's default branch (master) or its active branch (3.0) -- and
# ran `pytest tests/`, a path that does not exist. As a result nothing was
# checked on any branch. Two consecutive commits shipped a UI that failed 87 of
# its 88 tests.
on:
  push:
    branches: [master, "3.*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: TypeScript + Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm

      - run: npm ci

      # Type errors alone do not fail the render tree, so both gates matter:
      # tsc caught nothing when the redesign broke, vitest caught everything.
      - name: Type check
        run: npx tsc --noEmit

      - name: Unit and component tests
        run: npx vitest run

  sidecar:
    name: Python sidecar
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      # tests/ holds the whole sidecar suite, including the byte-level redaction
      # contract in test_sidecar_contract.py. There is nothing to exclude any
      # more: the customtkinter GUI package those exclusions covered is gone.
      - name: Sidecar tests
        run: python -m pytest tests/ -q

  tauri:
    name: Rust bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri's Linux build needs the WebKitGTK stack even to compile the crate.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test --locked
